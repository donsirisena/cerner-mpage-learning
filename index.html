<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      http-equiv="Content-Type"
      content="XMLCCLREQUEST,APPLINK,MPAGES_EVENT"
      name="discern"
    />

    <title>Patient List MPage</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="page-header">
      <img src="logo.png" alt="Organization logo" class="page-logo" />

      <div>
        <h1>Patient Diagnosis</h1>
        <p>MRD Mpage Test Project</p>
      </div>
    </div>

    <div class="container">
      <div class="toolbar">
        <div>
          <label for="searchBox"> Search Patient </label>
          <br />

          <input
            type="text"
            id="searchBox"
            placeholder="Name or exact MRN..."
          />
        </div>

        <div>
          <label for="diagnosisFilter"> Diagnosis </label>
          <br />

          <select id="diagnosisFilter">
            <option value="all">All Diagnoses</option>
          </select>
        </div>

        <div>
          <label for="fromDate">From Date</label>
          <br />

          <input type="date" id="fromDate" required />
        </div>

        <div>
          <label for="toDate">To Date</label>
          <br />

          <input type="date" id="toDate" required />
        </div>

        <div>
          <label>&nbsp;</label>
          <br />

          <button id="refreshButton">Refresh</button>
        </div>
      </div>

      <div id="statusMessage" class="status" role="status" aria-live="polite">
        Waiting to load patients...
      </div>

      <div class="table-card">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th id="nameHeader" class="sortable resizable">
                  Patient Name
                  <span id="nameSortIndicator">↕</span>
                  <span class="resize-handle"></span>
                </th>

                <th class="resizable">
                  MRN
                  <span class="resize-handle"></span>
                </th>

                <th class="resizable">
                  Age
                  <span class="resize-handle"></span>
                </th>

                <th id="diagnosisHeader" class="sortable resizable">
                  Diagnosis
                  <span id="diagnosisSortIndicator">↕</span>
                  <span class="resize-handle"></span>
                </th>
              </tr>
            </thead>

            <tbody id="patientTableBody"></tbody>
          </table>
        </div>
      </div>

      <div id="patientDetails" class="details-card">
        <h2>Patient Details</h2>

        <p>Select a patient from the table.</p>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
